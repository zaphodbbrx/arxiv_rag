[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.4.1",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.55.0",
    "tiktoken>=0.12.0",
    "transformers>=5.4.0",
    "uvicorn>=0.42.0",
]

[tool.uv.scripts]
ingest = "python scripts/ingest.py"
index = "python scripts/build_index.py"
serve = "uvicorn src.api.main:app --reload --port 8000"
ui = "streamlit run src/ui/app.py --port 8501"
eval = "python scripts/run_eval.py"
generate-qa = "python scripts/generate_qa.py"
demo = "python scripts/demo.py"
test = "pytest tests/ -v"
lint = "ruff check src/ && mypy src/"
lint-fix = "ruff check src/ --fix"
